<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Memory Galaxy</title>
  <style>
    :root { color-scheme: dark; --panel: rgba(10,14,28,.88); --accent:#7dd3fc; --line:#334155; }
    * { box-sizing:border-box; } body { margin:0; overflow:hidden; font:14px/1.45 system-ui,sans-serif; background:#020617; color:#e2e8f0; }
    canvas { display:block; cursor:grab; } canvas.dragging { cursor:grabbing; }
    .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; backdrop-filter:blur(10px); }
    .controls { top:14px; left:14px; width:min(360px,calc(100vw - 28px)); display:grid; gap:9px; }
    .row { display:flex; gap:8px; } input,textarea,button,select { font:inherit; }
    input,textarea { width:100%; border:1px solid #475569; background:#0f172a; color:inherit; border-radius:8px; padding:8px; }
    textarea { min-height:88px; resize:vertical; } button { border:0; border-radius:8px; padding:8px 12px; background:#164e63; color:#fff; cursor:pointer; }
    button:hover { background:#0e7490; } button.ghost { background:#1e293b; } .muted { color:#94a3b8; font-size:12px; }
    .detail { top:14px; right:14px; width:min(380px,calc(100vw - 28px)); max-height:min(78vh,700px); overflow:auto; display:none; }
    .detail h1 { margin:0 0 8px; font-size:19px; } .tag { display:inline-block; margin:2px 4px 2px 0; padding:2px 7px; background:#164e63; border-radius:99px; font-size:12px; }
    .alias { color:#7dd3fc; font-size:12px; margin-bottom:8px; } .content { white-space:pre-wrap; color:#cbd5e1; }
    .hidden { display:none!important; } .status { min-height:18px; color:#94a3b8; } a { color:var(--accent); cursor:pointer; }
  </style>
</head>
<body>
<canvas id="galaxy"></canvas>
<main class="panel controls">
  <h1 style="margin:0;font-size:20px">Memory Galaxy</h1>
  <div class="row"><input id="search" placeholder="Search memories..." autocomplete="off"><button id="fit" class="ghost">Fit</button><button id="addToggle" class="ghost">Add</button></div>
  <div id="status" class="status">Loading galaxy...</div>
  <form id="memoryForm" class="hidden">
    <input id="title" placeholder="Memory title" required>
    <input id="tags" placeholder="tags, comma separated">
    <textarea id="content" placeholder="What should Jarvis remember?"></textarea>
    <button>Save memory</button>
  </form>
</main>
<aside id="detail" class="panel detail"><button class="ghost" id="close">Close</button><h1 id="dTitle"></h1><div id="dAlias" class="alias"></div><div id="dTags"></div><div id="dContent" class="content"></div><div id="dLinks"></div></aside>
<script>
const canvas=document.getElementById('galaxy'),ctx=canvas.getContext('2d');let graph={nodes:[],links:[]},view={x:innerWidth/2,y:innerHeight/2,zoom:1},selected=null,hover=null,drag=null,matches=new Set(),positions=new Map();
const resize=()=>{canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)};
addEventListener('resize',resize);resize();
function layout(nodes){const n=Math.max(nodes.length,1);nodes.forEach((node,i)=>{const a=i*2.39996,r=70+140*Math.sqrt(i/Math.max(n-1,1));positions.set(node.id,{x:Math.cos(a)*r+(Math.random()-.5)*25,y:Math.sin(a)*r+(Math.random()-.5)*25,vx:0,vy:0})})}
function fitView(){if(!positions.size)return;const points=[...positions.values()];const minX=Math.min(...points.map(p=>p.x))-120,maxX=Math.max(...points.map(p=>p.x))+120,minY=Math.min(...points.map(p=>p.y))-120,maxY=Math.max(...points.map(p=>p.y))+120;const zoom=Math.max(.15,Math.min(2,Math.min(innerWidth/(maxX-minX),innerHeight/(maxY-minY))));const cx=(minX+maxX)/2,cy=(minY+maxY)/2;view={x:innerWidth/2-zoom*cx,y:innerHeight/2-zoom*cy,zoom}}
function neighbors(id){return new Set(graph.links.flatMap(l=>l.source===id?[l.target]:l.target===id?[l.source]:[]))}
async function load(){try{const r=await fetch('/api/graph');graph=await r.json();layout(graph.nodes);fitView();matches=new Set(graph.nodes.map(n=>n.id));document.getElementById('status').textContent=`${graph.nodes.length} memories · ${graph.links.length} links`}catch(e){document.getElementById('status').textContent='Server unavailable'}} 
async function search(q){if(!q.trim()){matches=new Set(graph.nodes.map(n=>n.id));return}const r=await fetch('/api/search?q='+encodeURIComponent(q));const data=await r.json();matches=new Set(data.results.nodes.map(n=>n.id));document.getElementById('status').textContent=`${data.count} matches`}
function show(node){const m=graph.nodes.find(n=>n.id===node.id);if(!m)return;selected=node.id;document.getElementById('detail').style.display='block';document.getElementById('dTitle').textContent=m.title;document.getElementById('dAlias').textContent=m.aliases?.length?m.aliases.join(' · '):'';document.getElementById('dTags').innerHTML=m.tags.map(t=>`<span class="tag">${t}</span>`).join('');document.getElementById('dContent').textContent=m.content||m.excerpt;const ns=neighbors(node.id);document.getElementById('dLinks').innerHTML=ns.size?'<strong>Connected memories</strong><br>'+[...ns].map(id=>{const n=graph.nodes.find(x=>x.id===id);return n?`<a onclick='select("${id}")'>${n.title}</a>`:''}).join('<br>'):''}
function select(id){const p=positions.get(id);if(p){view.x=innerWidth/2-p.x*view.zoom;view.y=innerHeight/2-p.y*view.zoom}show({id})}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.zoom,view.zoom);
const linked=selected?neighbors(selected):new Set();ctx.lineWidth=1;for(const l of graph.links){const a=positions.get(l.source),b=positions.get(l.target);if(!a||!b)continue;const on=selected&&(l.source===selected||l.target===selected);ctx.strokeStyle=on?'rgba(125,211,252,.85)':'rgba(100,116,139,.22)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
for(const n of graph.nodes){const p=positions.get(n.id);if(!p)continue;const r=7+Math.min(n.degree*1.3,12);const dim=!matches.has(n.id)||(selected&&!linked.has(n.id)&&selected!==n.id);ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle=dim?'rgba(71,85,105,.45)':n.id===selected?'#facc15':n.id===hover?'#f0f9ff':'#38bdf8';ctx.shadowColor=dim?'transparent':'#38bdf8';ctx.shadowBlur=dim?0:16;ctx.fill();ctx.shadowBlur=0;const active=n.id===hover||n.id===selected;ctx.fillStyle=dim?'#64748b':active?'#e0f2fe':'#cbd5e1';ctx.font=(active?'600 ':'')+'12px system-ui';const text=n.title.length>58?n.title.slice(0,55)+'...':n.title;ctx.fillText(text,p.x+r+8,p.y+4)}ctx.restore();requestAnimationFrame(draw)}
function screenToWorld(x,y){return{x:(x-view.x)/view.zoom,y:(y-view.y)/view.zoom}}
function pick(x,y){const w=screenToWorld(x,y);return graph.nodes.find(n=>{const p=positions.get(n.id);return p&&Math.hypot(p.x-w.x,p.y-w.y)<(20+Math.min(n.degree*1.3,12))/view.zoom})}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag){view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y}else{hover=pick(e.clientX,e.clientY)?.id||null;canvas.style.cursor=hover?'pointer':'grab'}});
canvas.addEventListener('pointerup',e=>{const moved=drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>4;drag=null;canvas.classList.remove('dragging');if(!moved){const node=pick(e.clientX,e.clientY);node?show(node):(selected=null,document.getElementById('detail').style.display='none')}});
canvas.addEventListener('wheel',e=>{e.preventDefault();view.zoom=Math.min(3,Math.max(.15,view.zoom*Math.exp(-e.deltaY*.0012)))},{passive:false});
document.getElementById('search').addEventListener('input',e=>search(e.target.value));document.getElementById('fit').onclick=fitView;document.getElementById('addToggle').onclick=()=>document.getElementById('memoryForm').classList.toggle('hidden');
document.getElementById('close').onclick=()=>{selected=null;document.getElementById('detail').style.display='none'};
document.getElementById('memoryForm').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Saving...';const body={title:title.value,content:content.value,tags:tags.value.split(',').map(s=>s.trim()).filter(Boolean)};const r=await fetch('/api/memories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){e.target.reset();e.target.classList.add('hidden');load();status.textContent='Memory saved'}else status.textContent=(await r.json()).error};
load();draw();
</script>
</body>
</html>
